[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aircall-mcp"
version = "0.1.0"
description = "MCP server for Aircall — calls, contacts, transcripts, numbers, and team management for law firms"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp==2.0.0",
    "requests>=2.34.2",
    "python-dotenv>=1.2.2",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.16,<0.17",
]

[project.scripts]
aircall-mcp = "aircall_mcp.server:main"
aircall-mcp-setup = "aircall_mcp.setup.setup:main"
aircall-mcp-verify = "aircall_mcp.setup.verify:main"

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "venv", "dist", "build"]
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
