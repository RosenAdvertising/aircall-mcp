[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aircall-mcp"
version = "0.1.0"
description = "MCP server for Aircall: calls, transcripts, contacts, numbers and teams."
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=2.3,<3",
    "requests>=2.34.2",
    "python-dotenv>=1.2.2",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.17,<0.18",
]

[project.scripts]
aircall-mcp = "aircall_mcp.server:main"
aircall-mcp-setup = "aircall_mcp.setup.setup:main"
aircall-mcp-verify = "aircall_mcp.setup.verify:main"

[project.urls]
Homepage = "https://github.com/RosenAdvertising/aircall-mcp"
Repository = "https://github.com/RosenAdvertising/aircall-mcp"
Issues = "https://github.com/RosenAdvertising/aircall-mcp/issues"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "venv", "dist", "build"]
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
